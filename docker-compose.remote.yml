services:
    camera1:
            image: registry.fls-engineering.de/cam:3.6.2
            volumes:
                - ./cam_settings:/settings
                - /mnt/d/imagestoupload:/images
            ipc: "service:redis"


            environment:
                - CAMERA_CAMINDEX=1
                - CAMERA_NAME=cam1
                - CAMERA_STOREIMAGES=OFF
                - CAMERA_STOREPATH=/images
                - CAMERA_REDIS=tcp://0.0.0.0:6379
                - CAMERA_SETTINGSFILE=/settings/cam1_settings.json
                - CAMERA_IPCPORT=ipc:///dev/shm/camera1.input
                - CAMERA_FLIP_RGB=ON
                - CAMERA_IP=10.13.17.10
            # command: sh -c "arv-fake-gv-camera-0.10 & /development/build/bin/Opticus_ARCAM"
            network_mode: host
            restart: unless-stopped

