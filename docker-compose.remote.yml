    opcua-server:
        image: registry.fls-engineering.de/opcua-server:1.0.0
        volumes:
            - ./nodes.json:/app/nodes.json
        # working_dir: /development
        environment:
            - MEASUREMENT_RESULTS_TIMEOUT=8
        command: python3 /app/app.py
        ports: 
        - "4840:4840"
        restart: unless-stopped
        depends_on:
            - redis
        networks:
            default:
                aliases:
                    - "opcua"

    flow:
        image: registry.fls-engineering.de/flow_engine_wo_ai:0.7.0  
        # network_mode: host
        environment:
            - PYTHONPATH=/app
            - FLOW_FILE=
            - FLOW_WORKERS=16
            - STATIC_DIR=/flows/static
            - FLOW_GLOBAL__redis_unix_socket_path=/dev/shm/redis.sock
            - FLOW_LOG_LEVEL=INFO
            - FLOW_MEMORY_THRESHOLD_MB=10000
            - FLOW_BACKPRESSURE_MB=9000
        volumes:
            - ./flows:/flows
            - /mnt/d/imagestoupload:/output
            - /mnt/d/testBilder:/testbilder
            - /mnt/d/backup:/backup
            - ./stations:/stations
           

        ipc: "service:redis"
        ports: 
            - "5000:5000"
            - "8000:8000"
        networks:
            - default

        depends_on:
            - redis
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 10g
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]


    redis:
        image: redis/redis-stack:latest
        volumes:
            - ./redis-stack.conf:/redis-stack.conf
        
        ports:
            - "6379:6379"
            - "8004:8001"
        env_file:
            - ./.env
        ipc: shareable
        shm_size: 256m
        restart: unless-stopped
        healthcheck:
            disable: true
        networks:
            default:
    database:
        image: mariadb:latest
        environment:
            MYSQL_ROOT_PASSWORD: examplepassword
            MYSQL_DATABASE: exampledb
            MYSQL_USER: exampleuser
            MYSQL_PASSWORD: examplepassword
        ports:
            - "3306:3306"
        networks:
            default:

  # Web database client for inspecting MariaDB contents
    database-client:
        image: phpmyadmin:5-apache
        restart: unless-stopped
        depends_on:
            - database
        environment:
            PMA_HOST: database
            PMA_USER: exampleuser
            PMA_PASSWORD: examplepassword
            UPLOAD_LIMIT: 64M
        ports:
            - "8081:80"
        networks:
            default:

    file-mover:
        image: registry.fls-engineering.de/flow_engine_wo_ai:0.7.0  
        volumes:
        - /mnt/d/imagestoupload:/app/input
        - /mnt/d/BVbackup:/app/backup
        - ./flows/file-uploader-v1.json:/app/flow.json
        ipc: "service:redis"
        environment:
        - PYTHONPATH=/app
        - FLOW_GLOBAL__watcher_path=/app/input
        - FLOW_GLOBAL__backup_path=/app/backup     
        - FLOW_LOG_LEVEL=INFO
        - FLOW_FILE=/app/flow.json
        - FLOW_GLOBAL__ftp_host=grp-ghd-syn001.fritzmeier.intra
        - FLOW_GLOBAL__ftp_port=22
        - FLOW_GLOBAL__ftp_username=Foto_Upload_F7

        - FLOW_GLOBAL__target_path=/sFTP/WEY/F7
        - FLOW_GLOBAL__ftp_password=7F_daolpU_otoF
        - FLOW_GLOBAL__redis_unix_socket_path=/dev/shm/redis.sock
        - FLOW_LOG_LEVEL=DEBUG
        command: python3 engine/flow_headless.py 
        restart: unless-stopped
